<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Search and explore all 444 Ontario municipal boundaries.">
<title>Boundary explorer · Municipal Atlas</title>
<link rel="stylesheet" href="leaflet.css"><link rel="stylesheet" href="style.css">
<script defer src="leaflet.js"></script><script defer src="app.js"></script></head>
<body>
<header><div class="brand"><span class="logo" aria-hidden="true">≋</span>Municipal Atlas</div><span class="header-place">Ontario <span>/</span> Canada</span></header>
<main>
<div class="intro"><h1>Boundary explorer</h1><button id="download" disabled><span aria-hidden="true">↓</span> Export GeoJSON</button></div>
<section class="work" aria-label="Municipal boundary explorer">
<aside>
<div class="directory"><h2>Municipal directory</h2>
<form id="search-form" role="search"><label class="search">
<svg aria-hidden="true" viewBox="0 0 24 24"><circle cx="10" cy="10" r="6"/><path d="m15 15 5 5"/></svg>
<input id="search" type="search" aria-label="Search municipality by name" placeholder="Search by name…" autocomplete="off" disabled>
</label><button type="button" id="clear-search" aria-label="Clear search" hidden>×</button><button id="search-submit" aria-label="Zoom to first match" title="Zoom to first match" disabled>↵</button></form>
<div id="status" role="status">Loading boundaries…</div></div>
<ul id="list" aria-label="Municipalities"></ul>
</aside>
<div class="map-panel">
<div id="map" aria-label="Interactive satellite map of Ontario municipalities"></div>
<div class="map-tools"><button id="basemap" aria-pressed="true">Satellite</button><button id="reset">Fit Ontario</button></div>
<div id="selection" class="selection" hidden></div>
</div>
</section>
<section class="stats" aria-label="Filter by municipal tier">
<button data-tier="all" aria-pressed="true"><img class="coverage" alt="" src="coverage-all.png"><span>All municipalities</span><strong>444</strong><small>Across Ontario</small></button>
<button data-tier="lower" aria-pressed="false"><img class="coverage" alt="" src="coverage-lower.png"><span><i class="lower"></i>Lower tier</span><strong>241</strong><small>Local municipalities</small></button>
<button data-tier="single" aria-pressed="false"><img class="coverage" alt="" src="coverage-single.png"><span><i class="single"></i>Single tier</span><strong>173</strong><small>Independent municipalities</small></button>
<button data-tier="upper" aria-pressed="false"><img class="coverage" alt="" src="coverage-upper.png"><span><i class="upper"></i>Upper tier</span><strong>30</strong><small>Counties and regions</small></button>
</section>
<footer><a href="https://data.ontario.ca/dataset/municipal-boundaries" target="_blank" rel="noopener">Land Information Ontario ↗</a><span>Generalized municipal boundaries</span></footer>
</main></body></html>
